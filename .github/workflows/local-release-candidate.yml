name: Verify local release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit without game data
        shell: pwsh
        run: |
          $fxc = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\fxc.exe'
          ./scripts/experimental/ci_local_candidate.ps1 -WorkDirectory "$env:RUNNER_TEMP/rugby-candidate" -Fxc $fxc
